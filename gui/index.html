<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniDOAS.jl</title>

<style>
  :root {
    --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f7f9fb; --surface-3: #eef2f5;
    --text: #16202b; --muted: #5b6878; --faint: #8b97a5; --border: #e1e6eb; --border-strong: #cdd5de;
    --accent: #0f766e; --accent-strong: #0b5c55; --accent-soft: #e2f2f0; --accent-text: #0b5c55;
    --amber: #d97706; --amber-soft: #fef3c7; --ok: #15803d; --bad: #c2410c; --bad-soft: #fff1e8;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 8px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0 24px 60px rgba(16, 24, 40, 0.22), 0 4px 14px rgba(16, 24, 40, 0.10);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #151b23; --surface-2: #1a212a; --surface-3: #202833;
    --text: #e6edf3; --muted: #9ba8b5; --faint: #6f7c89; --border: #262f3a; --border-strong: #36414e;
    --accent: #2cc5b1; --accent-strong: #5eead4; --accent-soft: #11302d; --accent-text: #5eead4;
    --amber: #fbbf24; --amber-soft: #3a2c0b; --ok: #4ade80; --bad: #fb923c; --bad-soft: #3a1f10;
    --shadow-sm: none; --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--sans); display: flex; flex-direction: column;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent-text); }
  kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border-strong);
        border-bottom-width: 2px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
  .grow { flex: 1; min-width: 0; }
  .hidden { display: none !important; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px;
         border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; white-space: nowrap;
         box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s; }
  .btn:hover:not(:disabled) { background: var(--surface-3); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #062a26; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-3); }
  .btn.small { height: 26px; padding: 0 8px; font-size: 12.5px; }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .icon-btn { width: 30px; padding: 0; justify-content: center; }
  .btn .kbdhint { font-size: 11px; color: var(--faint); margin-left: 2px; }
  .btn.primary .kbdhint { color: rgba(255, 255, 255, 0.75); }
  input[type=text], input[type=number], select {
    height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); }
  input[type=number] { width: 84px; font-variant-numeric: tabular-nums; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* app bar */
  .appbar { display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 14px; background: var(--surface);
            border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
  .brand svg { width: 26px; height: 26px; }
  .brand .ver { font-weight: 500; font-size: 11px; color: var(--faint); padding: 1px 6px; border: 1px solid var(--border); border-radius: 999px; }
  .projbox { display: flex; flex-direction: column; min-width: 0; padding-left: 14px; border-left: 1px solid var(--border); line-height: 1.25; }
  .projbox .pname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .projbox .ppath { font: 11.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .appbar .actions { display: flex; align-items: center; gap: 6px; }
  .sep-v { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 36px; min-width: 290px; background: var(--surface); border: 1px solid var(--border);
          border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; display: none; z-index: 40; }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 10px;
                 border-radius: 7px; text-align: left; cursor: pointer; }
  .menu button:hover:not(:disabled) { background: var(--surface-3); }
  .menu button:disabled { opacity: 0.4; cursor: default; }
  .menu button .k { margin-left: auto; }
  .menu .mh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 6px 10px 3px; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; }
  .topline { height: 2px; background: transparent; position: relative; overflow: hidden; flex-shrink: 0; }
  .topline.on::after { content: ""; position: absolute; left: -30%; width: 30%; height: 100%; background: var(--accent);
                       animation: slide 1s ease-in-out infinite; }
  @keyframes slide { to { left: 100%; } }

  /* layout */
  .layout { flex: 1; display: flex; min-height: 0; }
  .side { width: 296px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .side h2 { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--faint);
             margin: 14px 16px 6px; display: flex; align-items: center; gap: 6px; }
  .side h2 .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
  .side h2 .src { margin-left: auto; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .winlist { margin: 0 8px; }
  .winrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .winrow:hover { background: var(--surface-3); }
  .winrow.sel { background: var(--accent-soft); }
  .winrow input { margin: 0; accent-color: var(--accent); }
  .winrow .nm { font-weight: 550; }
  .winrow .rng { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .winrow .edited { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .spec-tools { display: flex; gap: 6px; margin: 0 12px 8px; }
  .spec-tools input { flex: 1; min-width: 0; }
  .speclist { flex: 1; overflow: auto; margin: 0 8px; padding-bottom: 6px; }
  .spec { padding: 4px 8px; border-radius: 7px; cursor: pointer; font: 12px var(--mono); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .spec:hover { background: var(--surface-3); }
  .spec.sel { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .spec.sel { color: #062a26; }
  .spec .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex-shrink: 0; }
  .spec.ok .dot { background: var(--ok); border-color: var(--ok); }
  .spec.failed .dot { background: var(--bad); border-color: var(--bad); }
  .spec.sel .dot { border-color: rgba(255, 255, 255, 0.8); }
  .spec .nm { overflow: hidden; text-overflow: ellipsis; }
  .navbar { display: flex; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--border); align-items: center; }
  .navbar .btn.primary { flex: 1; justify-content: center; }
  .work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; align-items: center; gap: 2px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 550; }
  .tab:hover { background: var(--surface-3); color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent-text); }
  .tabs .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pane { display: none; flex: 1; overflow: auto; padding: 16px; }
  .pane.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px 0; flex-wrap: wrap; }
  .card-h h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
  .card-b { padding: 10px 14px 14px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); white-space: nowrap; }
  .pill.amber { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: var(--amber-soft); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-soft); }
  .pill.ok { color: var(--ok); }
  .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex-shrink: 0; }

  /* fit view */
  .fit-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .fit-head .title { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .fit-head .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .wchips { display: flex; gap: 4px; margin-left: auto; background: var(--surface-3); padding: 3px; border-radius: 9px; }
  .wchip { border: 0; background: none; padding: 4px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 550; }
  .wchip.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .wchip .n { font-size: 10.5px; color: var(--faint); margin-left: 4px; }
  .fit-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
  .fig { position: relative; }
  .fig svg { display: block; width: 100%; height: auto; user-select: none; }
  .fig .wbr { cursor: pointer; }
  .fig .wbr:hover path { stroke: var(--accent); stroke-width: 1.6; }
  .fig .wbr:hover text { fill: var(--accent-text); font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
  .legend i.dot { width: 7px; height: 7px; border: 0; border-radius: 50%; }
  .species-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-top: 14px; }
  .species-grid .card { margin: 0; }
  .sp-h { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 0; }
  .sp-h b { font-size: 13.5px; }
  .sp-h .val { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .sp-h .rel { color: var(--faint); font-size: 11.5px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
         box-shadow: var(--shadow-lg); padding: 6px 9px; font-size: 12px; line-height: 1.5; white-space: nowrap; display: none; z-index: 3;
         font-variant-numeric: tabular-nums; }
  .tip b { font-weight: 600; }
  .inspector { position: sticky; top: 0; display: flex; flex-direction: column; gap: 14px; }
  .inspector .card + .card { margin-top: 0; }
  .field-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; flex-wrap: wrap; }
  .field-row > label { color: var(--muted); font-size: 12.5px; min-width: 76px; }
  .inspector input[type=number] { width: 72px; }
  .seg { display: inline-flex; background: var(--surface-3); border-radius: 8px; padding: 2px; gap: 1px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .xs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .xs-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface);
             border-radius: 999px; padding: 2px 10px 2px 8px; cursor: pointer; font-size: 12.5px; }
  .xs-chip.off { opacity: 0.5; text-decoration: line-through; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; margin-left: auto; }
  .switch input { appearance: none; width: 30px; height: 17px; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { left: 15px; }
  .hint { color: var(--faint); font-size: 11.5px; margin: 10px 0 0; line-height: 1.6; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; width: 100%; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td.delta { font-size: 12px; }
  td.delta.big { color: var(--amber); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
  .stats div { background: var(--surface); padding: 7px 10px; }
  .stats small { display: block; color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
  .stats b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .banner { padding: 9px 12px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); margin-bottom: 12px; white-space: pre-wrap; }

  /* welcome */
  .welcome { max-width: 760px; margin: 6vh auto 0; }
  .welcome h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .welcome p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .recent { display: flex; flex-direction: column; gap: 2px; }
  .recent button { display: flex; flex-direction: column; align-items: flex-start; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
  .recent button:hover { background: var(--surface-3); }
  .recent .p { font: 11.5px var(--mono); color: var(--faint); }
  .empty { color: var(--muted); text-align: center; padding: 12vh 20px; }

  /* lab, results, project */
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .ctl { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }
  .ctl .pair { display: flex; align-items: center; gap: 5px; color: var(--faint); }
  .ctl input[type=number] { width: 76px; }
  .progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; min-width: 160px; flex: 1; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .lab-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; margin-top: 14px; }
  .lab-grid .card + .card { margin-top: 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { max-height: 52vh; overflow: auto; border-top: 1px solid var(--border); }
  .table-wrap table { font-size: 12px; width: auto; min-width: 100%; }
  .table-wrap th { position: sticky; top: 0; background: var(--surface); z-index: 1; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
  .table-wrap tr { cursor: pointer; }
  .table-wrap tbody tr:hover td { background: var(--surface-2); }
  .table-wrap tr.sel td { background: var(--accent-soft); }
  .xs-table td, .xs-table th { text-align: left; }
  .xs-table td.file { font: 11.5px var(--mono); color: var(--muted); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .proj-grid .card + .card { margin-top: 0; }
  .about { max-width: 860px; }
  .about p { line-height: 1.6; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; font-size: 12.5px; }
  .keys .k { display: flex; gap: 4px; flex-wrap: wrap; }

  /* status bar */
  .statusbar { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; font-size: 11.5px; color: var(--muted);
               background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
  .statusbar .conn { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 5px; }
  .statusbar .conn.off { background: var(--bad); }
  .statusbar .r { margin-left: auto; display: flex; gap: 14px; align-items: center; }

  /* dialogs */
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 32, 0.38); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.open { display: flex; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg);
            width: min(860px, 95vw); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .dialog > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .dialog > header h2 { margin: 0; font-size: 14.5px; }
  .dialog > footer { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
  .fd-bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 12.5px; }
  .crumbs button:hover { background: var(--surface-3); }
  .crumbs button:last-child { font-weight: 650; }
  .crumbs .slash { color: var(--faint); }
  .fd-body { display: flex; min-height: 340px; height: 52vh; }
  .fd-places { width: 190px; border-right: 1px solid var(--border); padding: 8px; overflow: auto; background: var(--surface-2); flex-shrink: 0; }
  .fd-places .mh { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 8px 8px 3px; }
  .fd-places button { display: flex; width: 100%; gap: 7px; align-items: center; border: 0; background: none; padding: 5px 8px; border-radius: 7px;
                      cursor: pointer; text-align: left; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fd-places button:hover { background: var(--surface-3); }
  .fd-places .ic { width: 15px; height: 15px; flex-shrink: 0; color: #3b82f6; }
  .fd-list { flex: 1; overflow: auto; padding: 6px; outline: none; }
  .fd-row { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 7px; cursor: default; font-size: 13px; user-select: none; }
  .fd-row:hover { background: var(--surface-3); }
  .fd-row.sel { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .fd-row.sel { color: #062a26; }
  .fd-row .ic { width: 16px; height: 16px; flex-shrink: 0; color: var(--faint); }

<script>
'use strict';
// =============================================================================
// small helpers
// =============================================================================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = p => String(p).split(/[\\/]/).pop();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const tilde = p => { const h = S && S.st && S.st.home; return h && String(p).startsWith(h) ? '~' + String(p).slice(h.length) : String(p); };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
function pref(k, d) { try { const v = localStorage.getItem('minidoas.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function setPref(k, v) { try { localStorage.setItem('minidoas.' + k, JSON.stringify(v)); } catch (e) {} }
function debounce(f, ms) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => f(...a), ms); }; }

const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const trim0 = s => s.includes('e') ? s : s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
// numbers for people: 0.0123, 1234, 3.32×10⁴³
function num(v, d = 3) {
  if (v === null || v === undefined || !isFinite(v)) return '–';
  if (v === 0) return '0';
  if (Number.isInteger(v) && Math.abs(v) < 1e6) return String(v);
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -3 && e < 5) return trim0(v.toFixed(Math.max(0, d - 1 - e)));
  return `${(v / 10 ** e).toFixed(d - 1)}×10${sup(e)}`.replace('-', '−');
}
// value ± error sharing one power of ten: "3.321 ± 0.057 ×10⁴³"
function pm(v, err, d = 3) {
  if (v === null || !isFinite(v)) return '–';
  if (err === null || !isFinite(err) || err === 1) return num(v, d + 1);
  const e = Math.floor(Math.log10(Math.max(Math.abs(v), Math.abs(err))));
  const f = (e >= -2 && e < 4) ? 0 : e;
  const k = 10 ** f, dec = Math.max(0, Math.min(6, d - 1 - Math.floor(Math.log10(Math.abs(err / k)))));
  const s = `${(v / k).toFixed(dec)} ± ${(err / k).toFixed(dec)}`.replace(/-/g, '−');
  return f ? `${s} ×10${sup(f)}` : s;
}

// =============================================================================
// server calls
// =============================================================================
let inflight = 0;
function busy(d) { inflight = Math.max(0, inflight + d); $('#topline').classList.toggle('on', inflight > 0); }
async function api(path, body, { raw = false } = {}) {
  busy(1);
  try {
    const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    let r;
    try { r = await fetch(path, opts); } catch (e) { setConn(false); throw new Error('The MiniDOAS.jl server is not reachable. Is Julia still running?'); }
    setConn(true);
    const ct = r.headers.get('Content-Type') || '';
    if (ct.includes('application/json')) {
      const j = await r.json();
      if (j && j.error) throw new Error(j.error);
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return j;
    }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return raw ? r : r.text();
  } finally { busy(-1); }
}
function setConn(ok) { $('#conn').classList.toggle('off', !ok); }
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'bad' ? 9000 : 3600);
}
function activity(s) { $('#activity').textContent = s || ''; }
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function downloadFrom(path, body, fallback) {
  const r = await api(path, body, { raw: true });
  const cd = r.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="([^"]+)"/);
  download(m ? m[1] : fallback, await r.blob());
}

// =============================================================================
// state
// =============================================================================
const S = {
  st: null, project: null, spectra: [], shown: [], fromFolder: '', selected: null,
  edits: {}, history: [], future: [],
  win: null,                     // window picked in the side list / project pane
  fit: null, fitWin: null, fitSeq: 0, fitError: '', live: pref('live', true),
  status: {}, results: null, resultsCol: null, resultsX: 'time', colorBy: 'elevation', resultsSel: null,
  map: null, mapQty: null, mapCell: null, mapHover: null,
  tab: 'fit',
};
const hasEdits = () => Object.keys(S.edits).length > 0;
const sentEdits = () => hasEdits() ? S.edits : null;
const projWin = name => S.project && S.project.windows.find(w => w.name === name);
function winSettings(name) {             // the window as the next fit will use it
  const w = projWin(name), e = S.edits[name] || {};
  if (!w) return null;
  return { name, enabled: e.enabled !== false, lmin: e.lmin ?? w.lmin, lmax: e.lmax ?? w.lmax,
           poly: e.poly_order ?? w.poly_order, exclude: new Set(e.exclude || []), w };
}

// =============================================================================
// plots: SVG drawn here, at the pixel size of their container
// =============================================================================
const PAL = {
  light: { bg: '#ffffff', text: '#2a3441', muted: '#6b7785', axis: '#aab4bf', grid: '#edf0f3', obs: '#334155',
           meas: '#8693a1', model: '#0f766e', resid: '#475569', band: 'rgba(15,118,110,0.11)', zero: '#c5ced7',
           win: '#d97706', winFill: 'rgba(245,158,11,0.12)', winOther: '#b9c2cc', cross: '#0f172a', poly: '#64748b' },
  dark: { bg: '#151b23', text: '#d6dee6', muted: '#94a1ae', axis: '#46515e', grid: '#222a34', obs: '#cbd5e1',
          meas: '#7b8895', model: '#2dd4bf', resid: '#a3afbb', band: 'rgba(45,212,191,0.13)', zero: '#3a4552',
          win: '#fbbf24', winFill: 'rgba(251,191,36,0.13)', winOther: '#4b5663', cross: '#e6edf3', poly: '#94a3b8' },
};
const theme = () => document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
const FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Roboto, Arial, sans-serif";
const SPECIES = { NO2: '#e0562b', O3: '#2563eb', O4: '#059669', SO2: '#c026d3', BrO: '#a16207', HCHO: '#d97706', CH2O: '#d97706',
                  H2O: '#0891b2', Ring: '#7c3aed', OClO: '#65a30d', IO: '#be123c', CHOCHO: '#0d9488', HONO: '#db2777' };
const FALLBACK = ['#2563eb', '#e0562b', '#059669', '#c026d3', '#d97706', '#0891b2', '#7c3aed', '#a16207', '#be123c'];
const speciesColor = (name, i) => SPECIES[name] || SPECIES[String(name).replace(/[_ ].*$/, '')] || FALLBACK[i % FALLBACK.length];

function extent(arrays, pad = 0) {
  let lo = Infinity, hi = -Infinity;
  for (const a of arrays) for (const v of a || []) if (v !== null && isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (lo === Infinity) return [0, 1];
  if (lo === hi) { const d = Math.abs(lo) * 0.05 || 1; lo -= d; hi += d; }
  const p = (hi - lo) * pad;
  return [lo - p, hi + p];
}
function ticks(lo, hi, n = 5) {
  const span = hi - lo;
  if (!(span > 0) || !isFinite(span)) return { t: [lo], step: 1 };
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const t = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) t.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return { t, step };
}
// tick labels, with one ×10ⁿ for very small or large numbers
function tickText(t, step) {
  const m = Math.max(...t.map(Math.abs));
  let e = m > 0 ? Math.floor(Math.log10(m)) : 0;
  if (e > -3 && e < 5) e = 0;
  const k = 10 ** e, dec = Math.max(0, -Math.floor(Math.log10(step / k) + 1e-9));
  return { labels: t.map(v => { let s = (v / k).toFixed(Math.min(dec, 7)); if (/^-0(\.0*)?$/.test(s)) s = s.slice(1); return s.replace('-', '−'); }), e };
}
function pathOf(xs, ys, X, Y) {
  let d = '', pen = false;
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], y = ys[i];
    if (x === null || y === null || !isFinite(x) || !isFinite(y)) { pen = false; continue; }
    d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true;
  }
  return d;
}
function dotsOf(xs, ys, X, Y) {          // zero-length segments with round caps: cheap dots
  let d = '';
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], y = ys[i];
    if (x === null || y === null || !isFinite(x) || !isFinite(y)) continue;
    d += 'M' + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + 'h0.01';
  }
  return d;
}
// breaks lines where the window has a gap (a jump of more than 3 pixels)
function withGaps(lam, ys) {
  const st = lam.slice(1).map((v, i) => v - lam[i]).filter(isFinite).sort((a, b) => a - b);
  const typ = st[st.length >> 1] || 1;
  const X = [], Y = ys.map(() => []);
  lam.forEach((v, i) => {
    if (i > 0 && v - lam[i - 1] > 3 * typ) { X.push(null); Y.forEach(y => y.push(null)); }
    X.push(v); ys.forEach((y, k) => Y[k].push(y ? y[i] : null));
  });
  return { x: X, y: Y };
}
let clipSeq = 0;
/*
 One plot area. o: { x, y, W, H, m:{l,r,t,b}, xlim, ylim, pad, series:[{x, y, color, width, opacity, dots, r, dash}],
   xlabel, ylabel, noXLabels, hband:[y0, y1, fill], vbands:[{x0, x1, fill}], zero, P, fs }
 Returns { svg, X, Y, inv, box }.
*/
function plot(o) {
  const P = o.P || PAL[theme()], fs = o.fs || 11;
  const m = o.m, ox = o.x || 0, oy = o.y || 0;
  const L = ox + m.l, T = oy + m.t, iw = o.W - m.l - m.r, ih = o.H - m.t - m.b;
  const [x0, x1] = o.xlim || extent(o.series.map(s => s.x));
  let [y0, y1] = o.ylim || extent(o.series.map(s => s.y).concat(o.hband ? [[o.hband[0], o.hband[1]]] : []), o.pad ?? 0.07);
  const X = v => L + (v - x0) / (x1 - x0) * iw, Y = v => T + ih - (v - y0) / (y1 - y0) * ih;
  const inv = px => x0 + (px - L) / iw * (x1 - x0);
  const id = 'c' + (++clipSeq);
  let s = `<clipPath id="${id}"><rect x="${L}" y="${T}" width="${iw}" height="${ih}"/></clipPath>`;
  const yt = ticks(y0, y1, Math.max(2, Math.round(ih / 42))), ytl = tickText(yt.t, yt.step);
  const xt = ticks(x0, x1, Math.max(2, Math.round(iw / 90))), xtl = tickText(xt.t, xt.step);
  yt.t.forEach((v, i) => {
    const yy = Y(v).toFixed(1);
    s += `<line x1="${L}" x2="${L + iw}" y1="${yy}" y2="${yy}" stroke="${P.grid}"/>`;
    s += `<text x="${L - 7}" y="${yy}" dy="0.33em" text-anchor="end" fill="${P.muted}" font-size="${fs}">${ytl.labels[i]}</text>`;
  });
  if (ytl.e) s += `<text x="${L - 7}" y="${T - 5}" text-anchor="end" fill="${P.muted}" font-size="${fs - 0.5}">×10${sup(ytl.e)}</text>`;
  s += `<line x1="${L}" x2="${L + iw}" y1="${T + ih}" y2="${T + ih}" stroke="${P.axis}"/>`;
  xt.t.forEach((v, i) => {
    const xx = X(v).toFixed(1);
    s += `<line x1="${xx}" x2="${xx}" y1="${T + ih}" y2="${T + ih + 4}" stroke="${P.axis}"/>`;
    if (!o.noXLabels) s += `<text x="${xx}" y="${T + ih + 7 + fs}" text-anchor="middle" fill="${P.muted}" font-size="${fs}">${xtl.labels[i]}</text>`;
  });
  s += `<g clip-path="url(#${id})">`;
  for (const b of o.vbands || []) {
    const a = Math.max(L, X(b.x0)), z = Math.min(L + iw, X(b.x1));
    if (z > a) s += `<rect x="${a.toFixed(1)}" y="${T}" width="${(z - a).toFixed(1)}" height="${ih}" fill="${b.fill}"/>`;
  }
  if (o.hband) s += `<rect x="${L}" y="${Y(o.hband[1]).toFixed(1)}" width="${iw}" height="${Math.max(0, Y(o.hband[0]) - Y(o.hband[1])).toFixed(1)}" fill="${o.hband[2]}"/>`;
  if (o.zero && y0 < 0 && y1 > 0) s += `<line x1="${L}" x2="${L + iw}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="${P.zero}" stroke-dasharray="3 3"/>`;
  for (const se of o.series) {
    const op = se.opacity ?? 1;
    if (se.dots) s += `<path d="${dotsOf(se.x, se.y, X, Y)}" stroke="${se.color}" stroke-opacity="${op}" stroke-width="${2 * (se.r || 1.5)}" stroke-linecap="round" fill="none"/>`;
    else s += `<path d="${pathOf(se.x, se.y, X, Y)}" fill="none" stroke="${se.color}" stroke-opacity="${op}" stroke-width="${se.width || 1.5}" stroke-linejoin="round"${se.dash ? ` stroke-dasharray="${se.dash}"` : ''}/>`;
  }
  s += '</g>';
  if (o.xlabel) s += `<text x="${L + iw / 2}" y="${T + ih + 2 * fs + 12}" text-anchor="middle" fill="${P.muted}" font-size="${fs}">${esc(o.xlabel)}</text>`;
  if (o.ylabel) s += `<text transform="translate(${ox + 12},${T + ih / 2}) rotate(-90)" text-anchor="middle" fill="${P.muted}" font-size="${fs}">${esc(o.ylabel)}</text>`;
  return { svg: s, X, Y, inv, box: { L, T, iw, ih }, xlim: [x0, x1], ylim: [y0, y1] };
}
const svgOpen = (W, H, P, extra = '') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}"${extra}><rect width="${W}" height="${H}" fill="${P.bg}"/>`;

// ----- the figures of one fit ------------------------------------------------
function fitParts(win) {
  const c = win.curves, g = withGaps(c.lambda, [c.od, c.model, c.residual]);
  const lam = c.lambda.filter(v => v !== null);
  const pad = (lam[lam.length - 1] - lam[0]) * 0.01;
  return { c, g, xlim: [lam[0] - pad, lam[lam.length - 1] + pad] };
}
function odPanel(win, W, P, x = 0, y = 0, fs = 11) {
  const { c, g, xlim } = fitParts(win);
  const H1 = 232, H2 = 112;
  const a = plot({ x, y, W, H: H1, m: { l: 62, r: 14, t: 14, b: 6 }, xlim, P, fs, noXLabels: true, ylabel: 'Differential optical density',
    series: [{ x: g.x, y: g.y[0], dots: true, r: 1.6, color: P.meas, opacity: 0.9 }, { x: g.x, y: g.y[1], color: P.model, width: 2 }] });
  const r = win.rms || 0;
  const b = plot({ x, y: y + H1, W, H: H2 + 2 * fs + 30, m: { l: 62, r: 14, t: 22, b: 2 * fs + 16 }, xlim, P, fs, zero: true, hband: [-r, r, P.band],
    ylabel: 'Residual', xlabel: 'Wavelength (nm)', series: [{ x: g.x, y: g.y[2], color: P.resid, width: 1.2 }] });
  return { svg: a.svg + b.svg, H: H1 + H2 + 2 * fs + 30, a, b, g };
}
function speciesPanel(comp, lam, res, color, W, P, x = 0, y = 0, fs = 10.5, H = 168) {
  const meas = comp.value.map((v, i) => v === null || res[i] === null ? null : v + res[i]);
  const g = withGaps(lam, [meas, comp.value]);
  const l2 = lam.filter(v => v !== null), pad = (l2[l2.length - 1] - l2[0]) * 0.01;
  return plot({ x, y, W, H, m: { l: 56, r: 10, t: 16, b: 2 * fs + 16 }, P, fs, zero: true, xlim: [l2[0] - pad, l2[l2.length - 1] + pad],
    xlabel: 'Wavelength (nm)', series: [{ x: g.x, y: g.y[0], dots: true, r: 1.35, color, opacity: 0.33 }, { x: g.x, y: g.y[1], color, width: 2 }] });
}
// The observed spectrum. The active window is drawn by the caller; the other windows are
// brackets above the plot, stacked in rows so that overlapping windows never collide, and
// the strip grows by one row for each extra row of brackets.
function spectrumPanel(fit, W, P, active, x = 0, y = 0, fs = 11, H0 = 178) {
  const o = fit.observed;
  const pad = (o.lambda[o.lambda.length - 1] - o.lambda[0]) * 0.01;
  const xlim = [o.lambda[0] - pad, o.lambda[o.lambda.length - 1] + pad];
  const L = x + 62, iw = W - 62 - 14, X = v => L + (v - xlim[0]) / (xlim[1] - xlim[0]) * iw;
  const others = [];
  for (const w of fit.windows) {
    if (w.name === active) continue;
    const ws = winSettings(w.name), rng = ws ? [ws.lmin, ws.lmax] : w.curves.fit_range;
    const a = X(rng[0]), z = X(rng[1]), c = (a + z) / 2;
    const half = Math.max((z - a) / 2, 0.31 * (fs - 1) * w.name.length + 4);   // room for the label
    others.push({ name: w.name, rng, a, z, s0: c - half - 6, s1: c + half + 6 });
  }
  others.sort((p, q) => p.s0 - q.s0);
  const ends = [];                                  // right end of each row so far
  for (const b of others) {
    let k = ends.findIndex(e => e < b.s0);
    if (k < 0) { k = ends.length; ends.push(0); }
    ends[k] = b.s1; b.row = k;
  }
  const ROW = fs + 5, rows = ends.length, top = rows ? 8 + rows * ROW : 16, H = H0 + Math.max(0, rows - 1) * ROW;
  const p = plot({ x, y, W, H, m: { l: 62, r: 14, t: top, b: 2 * fs + 16 }, xlim, P, fs, pad: 0.05, ylabel: 'Counts', xlabel: 'Wavelength (nm)',
    series: [{ x: o.lambda, y: o.counts, color: P.obs, width: 1.1 }] });
  let s = p.svg;
  for (const b of others) {
    const yy = p.box.T - 4 - b.row * ROW;           // bracket line; row 0 is nearest the plot
    s += `<g class="wbr" data-w="${esc(b.name)}"><title>${esc(b.name)}: ${b.rng[0].toFixed(1)}–${b.rng[1].toFixed(1)} nm</title>` +
         `<rect x="${b.s0.toFixed(1)}" y="${(yy - ROW + 2).toFixed(1)}" width="${(b.s1 - b.s0).toFixed(1)}" height="${ROW + 1}" fill="transparent"/>` +
         `<path d="M${b.a.toFixed(1)} ${yy + 4}V${yy}H${b.z.toFixed(1)}v4" fill="none" stroke="${P.winOther}"/>` +
         `<text x="${((b.a + b.z) / 2).toFixed(1)}" y="${yy - 3}" text-anchor="middle" fill="${P.muted}" font-size="${fs - 1}">${esc(b.name)}</text></g>`;
  }
  return { svg: s, p, xlim, H };
}

// =============================================================================
// fit view
// =============================================================================
function renderFitPane() {
  const el = $('#pane-fit');
  if (!S.project) { el.innerHTML = welcomeHtml(); bindWelcome(el); return; }
  if (!S.fit) {
    el.innerHTML = `<div class="empty"><div style="font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px">Select a spectrum and press <kbd>Enter</kbd></div>
      Or double-click it. <kbd>↑</kbd> <kbd>↓</kbd> step through the spectra and fit each one.</div>`;
    return;
  }
  const f = S.fit;
  const wi = Math.max(0, f.windows.findIndex(w => w.name === S.fitWin));
  const w = f.windows[wi];
  S.fitWin = w ? w.name : null;
  const rec = f.record || {};
  const meta = [`${esc(f.date)} ${esc(f.time)} UTC`];
  if (rec.elevation !== null && rec.elevation !== undefined) meta.push(`elevation ${num(rec.elevation)}°`);
  if (rec.latitude !== null && rec.latitude !== undefined) meta.push(`${Math.abs(rec.latitude).toFixed(2)}°${rec.latitude >= 0 ? 'N' : 'S'} ${Math.abs(rec.longitude).toFixed(2)}°${rec.longitude >= 0 ? 'E' : 'W'}`);
  meta.push(`fitted in ${(f.seconds * 1000).toFixed(f.seconds < 0.01 ? 1 : 0)} ms`);
  el.innerHTML = `
    ${S.fitError ? `<div class="banner">${esc(S.fitError)}</div>` : ''}
    <div class="fit-head">
      <div><div class="title">${esc(base(f.spectrum))}</div><div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div></div>
      <div class="wchips">${f.windows.map((x, i) => `<button class="wchip ${x.name === S.fitWin ? 'active' : ''}" data-w="${esc(x.name)}" title="${i < 9 ? 'Key ' + (i + 1) : ''}">${esc(x.name)}<span class="n">${i + 1}</span></button>`).join('')}</div>
    </div>
    <div class="fit-grid">
      <div>
        <div class="card"><div class="card-h"><h3>Spectrum</h3><span class="faint" style="font-size:12px">drag the shaded fit window, or its edges</span>
          <div class="legend"><span><i style="border-color:${PAL[theme()].obs}"></i>observed</span><span><span class="swatch" style="background:${PAL[theme()].winFill};border:1px solid ${PAL[theme()].win}"></span>${esc(w.name)} fit window</span></div></div>
          <div class="card-b fig" id="specFig"></div></div>
        <div class="card"><div class="card-h"><h3>Fit — ${esc(w.name)}</h3>
          <div class="legend"><span><i class="dot" style="background:${PAL[theme()].meas}"></i>measured</span><span><i style="border-color:${PAL[theme()].model}"></i>model</span><span><span class="swatch" style="background:${PAL[theme()].band}"></span>±RMS</span></div></div>
          <div class="card-b fig" id="odFig"></div></div>
        <div class="species-grid" id="speciesGrid"></div>
      </div>
      <div class="inspector" id="inspector"></div>
    </div>`;
  $$('.wchip', el).forEach(b => b.addEventListener('click', () => { S.fitWin = b.dataset.w; S.win = b.dataset.w; renderWindows(); renderFitPane(); }));
  drawFitFigures();
  renderInspector();
}

function drawFitFigures() {
  const f = S.fit; if (!f || !$('#odFig')) return;
  const w = f.windows.find(x => x.name === S.fitWin); if (!w) return;
  const P = PAL[theme()];
  // spectrum strip with the draggable fit window
  const sEl = $('#specFig'), W1 = Math.max(320, sEl.clientWidth - 28);
  const sp = spectrumPanel(f, W1, P, w.name);
  sEl.innerHTML = svgOpen(W1, sp.H, P) + sp.svg + '<g id="winBand"></g><g class="hover"></g></svg><div class="tip"></div>';
  $$('.wbr', sEl).forEach(g => g.addEventListener('click', () => { S.fitWin = S.win = g.dataset.w; renderWindows(); renderFitPane(); }));
  bindWindowDrag(sEl, sp.p, w.name);
  attachHover(sEl, sp.p, f.observed.lambda, [{ y: f.observed.counts, color: P.obs, label: 'counts' }]);
  // optical density and residual
  const oEl = $('#odFig'), W2 = Math.max(320, oEl.clientWidth - 28);
  const od = odPanel(w, W2, P);
  oEl.innerHTML = svgOpen(W2, od.H, P) + od.svg + '<g class="hover"></g></svg><div class="tip"></div>';
  const c = w.curves;
  attachHover(oEl, od.a, c.lambda, [{ y: c.od, color: P.meas, label: 'measured' }, { y: c.model, color: P.model, label: 'model' },
                                   { y: c.residual, color: P.resid, label: 'residual', plot: od.b }]);
  // one panel per absorber, and the polynomial
  const grid = $('#speciesGrid');
  const comps = c.components.map((x, i) => ({ ...x, color: speciesColor(x.name, i) }));
  if (c.polynomial) comps.push({ name: 'Polynomial', value: c.polynomial, scd: null, err: null, color: P.poly, poly: true });
  if (c.offset) comps.push({ name: 'Linear offset', value: c.offset, scd: null, err: null, color: P.poly, poly: true, offset: true });
  grid.innerHTML = comps.map((x, i) => {
    const rel = x.scd && x.err && x.err !== 1 ? Math.abs(x.err / x.scd) : null;
    return `<div class="card"><div class="sp-h"><span class="swatch" style="background:${x.color}"></span><b>${esc(x.name)}</b>
      ${x.poly ? `<span class="val muted">${x.offset ? 'order ' + (winSettings(w.name)?.w.linear_offset ?? '') : 'order ' + (winSettings(w.name)?.poly ?? '')}</span>` : `<span class="val">${pm(x.scd, x.err)}</span>`}
      ${rel !== null ? `<span class="rel" title="relative error">${rel < 0.995 ? (100 * rel).toFixed(rel < 0.1 ? 1 : 0) + '%' : '>100%'}</span>` : ''}</div>
      <div class="fig" data-i="${i}" style="padding:4px 6px 6px"></div></div>`;
  }).join('');
  $$('.fig', grid).forEach(el => {
    const x = comps[+el.dataset.i], W = Math.max(240, el.clientWidth - 12);
    const p = speciesPanel(x, c.lambda, c.residual, x.color, W, P);
    el.innerHTML = svgOpen(W, 168, P) + p.svg + '<g class="hover"></g></svg><div class="tip"></div>';
    attachHover(el, p, c.lambda, [{ y: x.value, color: x.color, label: x.name }]);
  });
}

// crosshair and read-out under the mouse
function attachHover(el, p, lam, series) {
  const svg = $('svg', el), g = $('g.hover', el), tip = $('.tip', el);
  if (!svg || !lam || !lam.length) return;
  const idx = [...lam.keys()].filter(i => lam[i] !== null);
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = svg.viewBox.baseVal.width / r.width;
    const px = (ev.clientX - r.left) * sx, py = (ev.clientY - r.top) * sx;
    const bx = p.box;
    if (px < bx.L || px > bx.L + bx.iw || py < bx.T - 10) { g.innerHTML = ''; tip.style.display = 'none'; return; }
    const l = p.inv(px);
    let lo = 0, hi = idx.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (lam[idx[mid]] < l) lo = mid; else hi = mid; }
    const i = Math.abs(lam[idx[lo]] - l) < Math.abs(lam[idx[hi]] - l) ? idx[lo] : idx[hi];
    const X = p.X(lam[i]);
    const P = PAL[theme()];
    let s = `<line x1="${X}" x2="${X}" y1="${bx.T}" y2="${(series.some(q => q.plot) ? series.find(q => q.plot).plot.box.T + series.find(q => q.plot).plot.box.ih : bx.T + bx.ih)}" stroke="${P.cross}" stroke-opacity="0.35"/>`;
    let t = `<b>${lam[i].toFixed(2)} nm</b>`;
    for (const q of series) {
      const v = q.y[i]; if (v === null || v === undefined) continue;
      const pp = q.plot || p;
      s += `<circle cx="${X}" cy="${pp.Y(v)}" r="3.2" fill="${q.color}" stroke="${P.bg}" stroke-width="1.5"/>`;
      t += `<br><span class="swatch" style="background:${q.color}"></span> ${esc(q.label)} ${num(v, 4)}`;
    }
    g.innerHTML = s;
    tip.innerHTML = t; tip.style.display = 'block';
    const er = el.getBoundingClientRect(), left = X / sx + (r.left - er.left), top = ev.clientY - er.top;
    tip.style.left = (left + 14 + tip.offsetWidth > el.clientWidth ? left - tip.offsetWidth - 14 : left + 14) + 'px';
    tip.style.top = Math.max(0, top - tip.offsetHeight / 2) + 'px';
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => { g.innerHTML = ''; tip.style.display = 'none'; });
}

// the fit window on the spectrum strip: drag its edges or the whole band
function bindWindowDrag(el, p, wname) {
  const svg = $('svg', el), band = $('#winBand', el), P = PAL[theme()];
  const ws = winSettings(wname); if (!ws) return;
  let cur = [ws.lmin, ws.lmax];
  const draw = () => {
    const a = p.X(cur[0]), z = p.X(cur[1]), T = p.box.T, H = p.box.ih;
    band.innerHTML = `<rect x="${a}" y="${T}" width="${Math.max(1, z - a)}" height="${H}" fill="${P.winFill}" data-edge="move" style="cursor:grab"/>
      <line x1="${a}" x2="${a}" y1="${T}" y2="${T + H}" stroke="${P.win}" stroke-width="1.5"/><line x1="${z}" x2="${z}" y1="${T}" y2="${T + H}" stroke="${P.win}" stroke-width="1.5"/>
      <rect x="${a - 5}" y="${T}" width="10" height="${H}" fill="transparent" data-edge="min" style="cursor:ew-resize"/>
      <rect x="${z - 5}" y="${T}" width="10" height="${H}" fill="transparent" data-edge="max" style="cursor:ew-resize"/>
      <rect x="${a - 3}" y="${T + H / 2 - 12}" width="6" height="24" rx="3" fill="${P.win}" pointer-events="none"/>
      <rect x="${z - 3}" y="${T + H / 2 - 12}" width="6" height="24" rx="3" fill="${P.win}" pointer-events="none"/>
      <text x="${(a + z) / 2}" y="${T + 14}" text-anchor="middle" font-size="11" font-weight="600" fill="${P.win}" pointer-events="none">${cur[0].toFixed(1)} – ${cur[1].toFixed(1)} nm</text>`;
  };
  draw();
  const toNm = ev => { const r = svg.getBoundingClientRect(); return p.inv((ev.clientX - r.left) * svg.viewBox.baseVal.width / r.width); };
  band.addEventListener('pointerdown', ev => {
    const edge = ev.target.dataset.edge; if (!edge) return;
    ev.preventDefault();
    const start = toNm(ev), orig = cur.slice(), [lo, hi] = p.xlim;
    band.setPointerCapture(ev.pointerId);
    const mv = e => {
      const d = toNm(e) - start;
      if (edge === 'min') cur[0] = clamp(orig[0] + d, lo, cur[1] - 2);
      else if (edge === 'max') cur[1] = clamp(orig[1] + d, cur[0] + 2, hi);
      else { const w = orig[1] - orig[0]; cur[0] = clamp(orig[0] + d, lo, hi - w); cur[1] = cur[0] + w; }
      cur = cur.map(v => Math.round(v * 10) / 10);
      draw();
    };
    const up = () => {
      band.removeEventListener('pointermove', mv); band.removeEventListener('pointerup', up);
      if (cur[0] !== orig[0] || cur[1] !== orig[1]) setEdits(wname, { lmin: cur[0], lmax: cur[1] });
    };
    band.addEventListener('pointermove', mv); band.addEventListener('pointerup', up);
  });
}

function renderInspector() {
  const el = $('#inspector'); if (!el || !S.fit) return;
  const f = S.fit, w = f.windows.find(x => x.name === S.fitWin); if (!w) return;
  const ws = winSettings(w.name), pw = ws.w;
  const maxPoly = Math.max(6, pw.poly_order, ws.poly);
  const polys = [-1]; for (let k = 0; k <= maxPoly; k++) polys.push(k);
  const base0 = f.baseline && f.baseline[w.name];
  const bterm = t => base0 && base0.terms.find(b => b.term === t);
  const xsTerms = new Set(pw.xs.map(x => x.sym));
  const rows = w.terms.filter(t => xsTerms.has(t.term)).map(t => {
    const b = bterm(t.term);
    const d = b && t.err ? (t.scd - b.scd) / t.err : null;
    return `<tr><td><span class="swatch" style="background:${speciesColor(t.term, pw.xs.findIndex(x => x.sym === t.term))}"></span> ${esc(t.term)}</td>
      <td>${pm(t.scd, t.err)}</td>${base0 ? `<td class="delta ${d !== null && Math.abs(d) >= 1 ? 'big' : ''}" title="change from the project's settings, in units of the error">${d === null ? '–' : (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(2) + 'σ'}</td>` : ''}</tr>`;
  }).join('');
  const shifts = w.shifts.filter(s => s.err !== 1 || s.shift !== 0).map(s => `<tr><td>${esc(s.sym)}</td><td>${s.err === 1 ? num(s.shift, 4) + ' nm, fixed' : pm(s.shift, s.err, 2) + ' nm'}</td></tr>
      ${s.stretch_err !== null && s.stretch_err !== 1 ? `<tr><td class="faint">stretch</td><td>${pm(s.stretch, s.stretch_err, 2)}</td></tr>` : ''}`).join('');
  el.innerHTML = `
    <div class="card"><div class="card-h"><h3>Fit window</h3>
        <label class="switch" title="Fit again as soon as a setting changes"><input type="checkbox" id="liveT" ${S.live ? 'checked' : ''}>live refit</label></div>
      <div class="card-b">
        <div class="field-row"><label>Interval</label>
          <input type="number" id="insMin" step="0.1" value="${ws.lmin}"> <span class="faint">to</span>
          <input type="number" id="insMax" step="0.1" value="${ws.lmax}"> <span class="faint">nm</span></div>
        <div class="field-row"><label>Polynomial</label><div class="seg" id="insPoly">${polys.map(k => `<button data-k="${k}" class="${k === ws.poly ? 'on' : ''}">${k < 0 ? 'none' : k}</button>`).join('')}</div></div>
        <div class="field-row" style="align-items:flex-start"><label style="padding-top:3px">Absorbers</label><div class="xs-chips grow">${pw.xs.map((x, i) =>
          `<button class="xs-chip ${ws.exclude.has(x.sym) ? 'off' : ''}" data-sym="${esc(x.sym)}" title="${ws.exclude.has(x.sym) ? 'Put back into the fit' : 'Leave out of the fit'}"><span class="swatch" style="background:${speciesColor(x.sym, i)}"></span>${esc(x.sym)}</button>`).join('')}</div></div>
        <div class="field-row" style="margin-top:14px">
          <button class="btn small" id="insUndo" ${S.history.length ? '' : 'disabled'} title="Undo (Ctrl+Z)">Undo</button>
          <button class="btn small" id="insRedo" ${S.future.length ? '' : 'disabled'} title="Redo (Ctrl+Shift+Z)">Redo</button>
          <button class="btn small" id="insReset" ${S.edits[w.name] ? '' : 'disabled'}>Reset window</button>
          ${S.live ? '' : '<button class="btn small primary" id="insFit">Fit ↵</button>'}
        </div>
        <p class="hint"><kbd>[</kbd> <kbd>]</kbd> move the start, <kbd>Shift</kbd>+<kbd>[</kbd> <kbd>]</kbd> the end by 0.5 nm; <kbd>,</kbd> <kbd>.</kbd> change the polynomial.
          <b>Save as…</b> writes the edits to a new project file.</p>
      </div></div>
    <div class="card"><div class="card-b">
      <div class="stats"><div><small>RMS</small><b>${num(w.rms, 3)}</b></div><div><small>χ²</small><b>${num(w.chi2, 3)}</b></div><div><small>Iterations</small><b>${w.iterations}</b></div></div>

function exportCurves() {
  const f = S.fit; if (!f) return toast('Fit a spectrum first', 'bad');
  const w = f.windows.find(x => x.name === S.fitWin), c = w.curves;
  const cols = [['wavelength_nm', c.lambda], ['measured_od', c.od], ['model_od', c.model], ['residual', c.residual]];
  if (c.polynomial) cols.push(['polynomial', c.polynomial]);
  if (c.offset) cols.push(['linear_offset', c.offset]);
  for (const x of c.components) {
    cols.push([x.name + '_fitted', x.value]);
    cols.push([x.name + '_measured', x.value.map((v, i) => v === null || c.residual[i] === null ? null : v + c.residual[i])]);
  }

  s += `# RMS ${w.rms}, chi2 ${w.chi2}, ${w.iterations} iterations\n`;
  for (const t of w.terms) s += `# SlCol(${t.term}) = ${t.scd} +- ${t.err}\n`;
  s += `# "<X>_measured" is the fitted <X> plus the residual (what the panels of the GUI show)\n`;
  s += cols.map(x => x[0]).join(',') + '\n';
  for (let i = 0; i < c.lambda.length; i++) s += cols.map(x => x[1][i] === null ? '' : x[1][i]).join(',') + '\n';

function composeFigure() {

  if (c.offset) comps.push({ name: 'Linear offset', value: c.offset, color: P.poly, poly: true });

  s += `<text x="24" y="58" font-size="13" fill="${P.muted}">${esc(f.date)} ${esc(f.time)} UTC · fit window ${c.fit_range[0].toFixed(1)}–${c.fit_range[1].toFixed(1)} nm · RMS ${num(w.rms, 3)} · MiniDOAS.jl</text>`;
  y = 74;
  const sp = spectrumPanel(f, W - 20, P, w.name, 10, y, fs, 200);
  const ws = winSettings(w.name), a = sp.p.X(ws ? ws.lmin : c.fit_range[0]), z = sp.p.X(ws ? ws.lmax : c.fit_range[1]);
  s += `<rect x="${a}" y="${sp.p.box.T}" width="${z - a}" height="${sp.p.box.ih}" fill="${P.winFill}" stroke="${P.win}"/>`;
  s += sp.svg.replace(/<g class="wbr"[^>]*>(<title>[^<]*<\/title>)?/g, '<g>');

  comps.forEach((x, i) => {
    const X0 = (i % cols) * cw, Y0 = y + Math.floor(i / cols) * 218;
    s += `<rect x="${X0 + 6}" y="${Y0 + 22}" width="10" height="10" rx="2" fill="${x.color}"/><text x="${X0 + 22}" y="${Y0 + 32}" font-size="14" font-weight="600" fill="${P.text}">${esc(x.name)}</text>`;
    if (!x.poly) s += `<text x="${X0 + cw - 12}" y="${Y0 + 32}" text-anchor="end" font-size="13" fill="${P.muted}">${esc(pm(x.scd, x.err))}</text>`;

function nudge(which, d) {
  const name = S.fitWin || S.win; const ws = name && winSettings(name); if (!ws) return;

  let a = ws.lmin, b = ws.lmax;

}
function switchWindow(d, abs) {
  const ws = S.fit ? S.fit.windows.map(w => w.name) : S.project ? S.project.windows.map(w => w.name) : [];
  if (!ws.length) return;
  let i = abs !== undefined ? abs : ws.indexOf(S.fitWin || S.win) + d;
  if (i < 0 || i >= ws.length) return;
  S.fitWin = S.win = ws[i]; renderWindows(); renderTab();
}
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key;
  if ($('#fileModal').classList.contains('open')) return;          // the dialog has its own keys
  if (k === 'Escape') { $$('.modal.open').forEach(m => m.classList.remove('open')); $('#exportMenu').classList.remove('open'); return; }
  if (mod && !e.altKey) {
    const kl = k.toLowerCase();
    if (kl === 'o') { e.preventDefault(); e.shiftKey ? openFolderDialog() : openProjectDialog(); }
    else if (kl === 's') { e.preventDefault(); saveProjectDialog(); }
    else if (kl === 'e') { e.preventDefault(); exportCsvAll(); }
    else if (k === 'Enter') { e.preventDefault(); runBatch(); }
    else if (kl === 'z' && !e.target.matches('input, select, textarea')) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (kl === 'y' && !e.target.matches('input, select, textarea')) { e.preventDefault(); redo(); }
    return;
  }
  if (e.target.matches('input, select, textarea') || e.altKey) return;
  if ($('#keysModal').classList.contains('open') && k !== '?') return;
  const map = {
    'ArrowDown': () => step(1), 'j': () => step(1), 'ArrowUp': () => step(-1), 'k': () => step(-1),
    'PageDown': () => step(10), 'PageUp': () => step(-10), 'Home': () => step(-1e9), 'End': () => step(1e9),
    'Enter': () => { if (S.tab !== 'fit') showTab('fit'); fitSelected(); },
    'ArrowLeft': () => switchWindow(-1), 'ArrowRight': () => switchWindow(1),
    '[': () => nudge('min', -0.5), ']': () => nudge('min', 0.5), '{': () => nudge('max', -0.5), '}': () => nudge('max', 0.5),
    ',': () => nudge('poly', -1), '.': () => nudge('poly', 1), '<': () => nudge('poly', -1), '>': () => nudge('poly', 1),
    'f': () => showTab('fit'), 'm': () => showTab('lab'), 'r': () => showTab('results'), 'p': () => showTab('project'),
    'd': () => setTheme(theme() === 'dark' ? 'light' : 'dark'),
    '/': () => { $('#specFilter').focus(); $('#specFilter').select(); },
    '?': () => { const m = $('#keysModal'); if (m.classList.contains('open')) m.classList.remove('open'); else { $('#keysBody').innerHTML = keysHtml(); m.classList.add('open'); } },
  };
  let f = map[k] || map[k.toLowerCase()];
  if (!f && /^[1-9]$/.test(k)) f = () => switchWindow(0, +k - 1);
  if (f) { e.preventDefault(); f(); }
});

// =============================================================================
// start
// =============================================================================
// #spectrum=<file name>&window=<name>&tab=fit|lab|results|project&theme=light|dark
async function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('theme')) setTheme(h.get('theme'));
  if (!S.project) return;
  if (h.get('window')) { S.win = S.fitWin = h.get('window'); renderWindows(); }
  if (h.get('filter')) { $('#specFilter').value = h.get('filter'); renderSpectra(); }
  const sp = h.get('spectrum');
  if (sp) { const p = S.spectra.find(x => base(x) === sp || x === sp); if (p) { markSelected(p, true); await fitSelected(); } }
  if (h.get('batch')) await runBatch();
  if (h.get('tab')) showTab(h.get('tab'));
}
(async () => {
  document.documentElement.dataset.theme = pref('theme', 'light');
  try {
    const st = await api('/api/state');
    S.st = st;
    $('#ver').textContent = 'v' + st.version;
    $('#runtime').textContent = `MiniDOAS.jl ${st.version} · Julia ${st.julia} · ${st.threads} thread${st.threads === 1 ? '' : 's'}`;
    if (st.project) setProject(st.project);
    else renderAll();
    await applyHash();
  } catch (e) { setConn(false); $('#runtime').textContent = 'Not connected'; toast(e.message, 'bad'); renderAll(); }
})();
window.addEventListener('hashchange', applyHash);
// connection check for the status bar (no busy indicator)
setInterval(() => fetch('/api/state').then(r => setConn(r.ok)).catch(() => setConn(false)), 15000);
</script>
